<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A Notion content calendar flowing through an n8n automation robot out to social networks.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="600" rx="28" fill="url(#bg)"/>
  <ellipse cx="600" cy="290" rx="520" ry="300" fill="url(#glow)"/>

  <!-- sparkles -->
  <g stroke="#a5b4fc" stroke-width="5" stroke-linecap="round">
    <path d="M150 110 v26 M137 123 h26"/>
    <path d="M1050 120 v22 M1039 131 h22"/>
    <path d="M620 110 v20 M610 120 h20" stroke="#fcd34d"/>
    <path d="M1010 470 v22 M999 481 h22" stroke="#fcd34d"/>
  </g>

  <!-- ===== Notion content calendar card ===== -->
  <g>
    <rect x="74" y="150" width="360" height="300" rx="20" fill="#f8fafc" stroke="#0b1120" stroke-width="5"/>
    <!-- title bar -->
    <rect x="74" y="150" width="360" height="56" rx="20" fill="#e2e8f0" stroke="#0b1120" stroke-width="5"/>
    <rect x="74" y="186" width="360" height="20" fill="#e2e8f0"/>
    <circle cx="104" cy="178" r="8" fill="#f87171" stroke="#0b1120" stroke-width="2.5"/>
    <circle cx="130" cy="178" r="8" fill="#fbbf24" stroke="#0b1120" stroke-width="2.5"/>
    <circle cx="156" cy="178" r="8" fill="#34d399" stroke="#0b1120" stroke-width="2.5"/>
    <!-- mini calendar icon -->
    <rect x="364" y="164" width="50" height="28" rx="6" fill="#fff" stroke="#0b1120" stroke-width="4"/>
    <path d="M364 174 h50" stroke="#0b1120" stroke-width="4"/>
    <path d="M376 160 v8 M402 160 v8" stroke="#0b1120" stroke-width="4" stroke-linecap="round"/>

    <!-- rows: each = checkbox + caption line + status pill -->
    <!-- row 1 (Approved) -->
    <rect x="98" y="232" width="26" height="26" rx="7" fill="#34d399" stroke="#0b1120" stroke-width="4"/>
    <path d="M104 245 l5 6 l9 -12" fill="none" stroke="#0b1120" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="138" y="238" width="120" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="300" y="232" width="100" height="28" rx="14" fill="#bbf7d0" stroke="#0b1120" stroke-width="3.5"/>
    <text x="350" y="251" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Approved</text>

    <!-- row 2 (Approved) -->
    <rect x="98" y="288" width="26" height="26" rx="7" fill="#34d399" stroke="#0b1120" stroke-width="4"/>
    <path d="M104 301 l5 6 l9 -12" fill="none" stroke="#0b1120" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="138" y="294" width="150" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="300" y="288" width="100" height="28" rx="14" fill="#bbf7d0" stroke="#0b1120" stroke-width="3.5"/>
    <text x="350" y="307" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Approved</text>

    <!-- row 3 (Draft) -->
    <rect x="98" y="344" width="26" height="26" rx="7" fill="#fff" stroke="#0b1120" stroke-width="4"/>
    <rect x="138" y="350" width="100" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="300" y="344" width="100" height="28" rx="14" fill="#e2e8f0" stroke="#0b1120" stroke-width="3.5"/>
    <text x="350" y="363" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Draft</text>

    <!-- row 4 (Draft) -->
    <rect x="98" y="400" width="26" height="26" rx="7" fill="#fff" stroke="#0b1120" stroke-width="4"/>
    <rect x="138" y="406" width="130" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="300" y="400" width="100" height="28" rx="14" fill="#e2e8f0" stroke="#0b1120" stroke-width="3.5"/>
    <text x="350" y="419" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Draft</text>
  </g>

  <!-- arrow: Notion -> robot -->
  <g stroke="#a5b4fc" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M448 300 h70"/>
    <path d="M506 286 l16 14 l-16 14"/>
  </g>

  <!-- ===== n8n automation robot ===== -->
  <g>
    <!-- connector nubs -->
    <circle cx="540" cy="300" r="9" fill="#818cf8" stroke="#0b1120" stroke-width="4"/>
    <circle cx="700" cy="300" r="9" fill="#818cf8" stroke="#0b1120" stroke-width="4"/>
    <!-- antenna -->
    <path d="M620 196 v-26" stroke="#0b1120" stroke-width="5" stroke-linecap="round"/>
    <circle cx="620" cy="160" r="10" fill="#fcd34d" stroke="#0b1120" stroke-width="4"/>
    <!-- head -->
    <rect x="548" y="200" width="144" height="120" rx="26" fill="url(#node)" stroke="#0b1120" stroke-width="6"/>
    <!-- face screen -->
    <rect x="566" y="220" width="108" height="64" rx="14" fill="#0b1120"/>
    <!-- eyes -->
    <circle cx="596" cy="250" r="10" fill="#a5e8ff"/>
    <circle cx="644" cy="250" r="10" fill="#a5e8ff"/>
    <!-- smile -->
    <path d="M596 268 q24 16 48 0" fill="none" stroke="#a5e8ff" stroke-width="5" stroke-linecap="round"/>
    <!-- cheek lights -->
    <circle cx="566" cy="300" r="6" fill="#34d399"/>
    <circle cx="674" cy="300" r="6" fill="#34d399"/>
    <!-- little gear badge -->
    <g transform="translate(692 206)">
      <circle cx="0" cy="0" r="15" fill="#fcd34d" stroke="#0b1120" stroke-width="4"/>
      <circle cx="0" cy="0" r="5" fill="#0b1120"/>
      <g stroke="#0b1120" stroke-width="4" stroke-linecap="round">
        <path d="M0 -15 v6 M0 15 v-6 M-15 0 h6 M15 0 h-6"/>
      </g>
    </g>
    <text x="620" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" fill="#a5b4fc" text-anchor="middle">n8n + Posta</text>
  </g>

  <!-- arrow: robot -> hub -->
  <g stroke="#a5b4fc" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M714 300 h64"/>
    <path d="M766 286 l16 14 l-16 14"/>
  </g>

  <!-- ===== social fan-out ===== -->
  <g>
    <circle cx="800" cy="300" r="12" fill="#a5b4fc" stroke="#0b1120" stroke-width="4"/>
    <!-- connectors -->
    <g stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M812 296 C 880 250, 940 210, 1000 196"/>
      <path d="M814 300 C 900 296, 950 286, 1010 282"/>
      <path d="M814 304 C 900 312, 950 322, 1010 330"/>
      <path d="M812 312 C 880 350, 940 392, 1000 412"/>
    </g>

    <!-- LinkedIn -->
    <circle cx="1040" cy="190" r="40" fill="#0a66c2" stroke="#0b1120" stroke-width="5"/>
    <text x="1040" y="203" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">in</text>

    <!-- Bluesky (butterfly) -->
    <circle cx="1052" cy="280" r="40" fill="#1185fe" stroke="#0b1120" stroke-width="5"/>
    <g fill="#fff">
      <path d="M1052 286 C 1040 268, 1024 260, 1024 276 C 1024 288, 1040 290, 1052 296 Z"/>
      <path d="M1052 286 C 1064 268, 1080 260, 1080 276 C 1080 288, 1064 290, 1052 296 Z"/>
    </g>

    <!-- Threads (@) -->
    <circle cx="1052" cy="370" r="40" fill="#101010" stroke="#0b1120" stroke-width="5"/>
    <text x="1052" y="384" font-family="ui-sans-serif,system-ui,sans-serif" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">@</text>

    <!-- Video (play) -->
    <circle cx="1040" cy="430" r="40" fill="#ec4899" stroke="#0b1120" stroke-width="5"/>
    <path d="M1030 414 l24 16 l-24 16 Z" fill="#fff"/>
  </g>
</svg>
