      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  minLength: 1
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password changed successfully
        '400':
          description: Validation error (e.g., weak password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/google:
    get:
      tags:
        - Auth
      summary: Initiate Google OAuth
      description: |
        Redirects the user to Google's OAuth consent screen.
        After authorization, Google redirects to `/v1/auth/google/callback`.
      parameters:
        - name: redirect_to
          in: query
          schema:
            type: string
            format: uri
          description: Frontend URL to redirect to after successful authentication
      responses:
        '302':
          description: Redirect to Google OAuth consent screen

  /v1/auth/google/callback:
    get:
      tags:
        - Auth
      summary: Google OAuth callback
      description: |
        Callback endpoint for Google OAuth. Google redirects here after the user
        authorizes. On success, redirects to the frontend with tokens in the URL hash fragment.

        Redirect format: `{redirect_to}#access_token=...&refresh_token=...&expires_at=...&user_id=...&user_email=...&user_name=...`
      parameters:
        - name: code
          in: query
          schema:
            type: string
          description: Authorization code from Google
        - name: state
          in: query
          schema:
            type: string
          description: State parameter containing redirect URL
        - name: error
          in: query
          schema:
            type: string
          description: Error code if user denied authorization
        - name: error_description
          in: query
          schema:
            type: string
          description: Human-readable error description
      responses:
        '302':
          description: Redirect to frontend with tokens in URL hash fragment

  # ─── Users: Onboarding, Account deletion ─────────────────────────────

  /v1/users/onboarding/complete:
    post:
      tags:
        - Users
      summary: Complete onboarding
      description: Mark the user's onboarding as complete and optionally set their selected plan.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedPlan:
                  type: string
                  description: The plan the user selected during onboarding
                  default: trial
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /v1/users/account:
    delete:
      tags:
        - Users
      summary: Delete user account
      description: Permanently delete the current user's account and all associated data including posts, media, and social account connections.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Account deleted successfully
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Media: Carousel PDF ─────────────────────────────────────────────

  /v1/media/generate-carousel-pdf:
    post:
      tags:
        - Media
      summary: Generate carousel PDF
      description: |
        Generate a multi-page PDF from selected media items for use as a LinkedIn carousel post.
        Each media item becomes one page in the PDF.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - media_ids
              properties:
                media_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Array of media IDs to include in the carousel
                title:
                  type: string
                  description: Optional title for the carousel document
      responses:
        '201':
          description: Carousel PDF generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  media_id:
                    type: string
                    format: uuid
                    description: ID of the newly created PDF media item
                  thumbnail_url:
                    type: string
                    format: uri
                  original_url:
                    type: string
                    format: uri
                    description: Signed URL to download the PDF
                  page_count:
                    type: integer
                    description: Number of pages in the generated PDF
        '400':
          description: Invalid media IDs or unsupported media types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Posts: Calendar ─────────────────────────────────────────────────

  /v1/posts/calendar:
    get:
      tags:
        - Posts
      summary: Calendar view
      description: Get posts within a date range for calendar display. Returns lightweight post objects.
      security:
        - bearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
      responses:
        '200':
          description: Posts in the date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        '400':
          description: Invalid date format or range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Tags ────────────────────────────────────────────────────────────

  /v1/tags:
    get:
      tags:
        - Tags
      summary: List tags
      description: List the current user's saved hashtag tags with optional search and sorting.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter tags by search term
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Maximum number of tags to return
        - name: sort
          in: query
          schema:
            type: string
            enum: [usage, recent, alpha]
            default: usage
          description: Sort order for tags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                  total:
                    type: integer
    post:
      tags:
        - Tags
      summary: Save tags
      description: Save one or more hashtag tags. Existing tags are returned as-is.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tags
              properties:
                tags:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                  minItems: 1
                  maxItems: 50
      responses:
        '201':
          description: Tags saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/tags/{id}:
    delete:
      tags:
        - Tags
      summary: Delete tag
      description: Delete a saved tag by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tag deleted
        '404':
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── SSE ─────────────────────────────────────────────────────────────

  /v1/sse/posts:
    get:
      tags:
        - SSE
      summary: Post status updates stream
      description: |
        Server-Sent Events stream for real-time post status updates.
        The connection stays open and sends events as posts are processed and published.

        **Authentication:** Pass the access token as a query parameter since
        the EventSource API does not support custom headers.

        **Events:**
        - `connected` — Initial connection confirmation
        - Post update events with current post status and results

        A keepalive comment is sent every 30 seconds to prevent timeouts.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          schema:
            type: string
          description: Access token (alternative to Authorization header for EventSource clients)
      responses:
        '200':
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream

  # ─── Feedback ────────────────────────────────────────────────────────

  /v1/feedback:
    post:
      tags:
        - Feedback
      summary: Submit feedback
      description: Submit user feedback. Requires authentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Thank you for your feedback!
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Waiting List ────────────────────────────────────────────────────

  /v1/waiting-list:
    post:
      tags:
        - Waiting List
      summary: Join waiting list
      description: Add an email address to the pre-launch waiting list. This is a public endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitingListRequest'
      responses:
        '201':
          description: Added to waiting list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '200':
          description: Already on waiting list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  already_registered:
                    type: boolean
        '400':
          description: Invalid email or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Webhooks: Meta ──────────────────────────────────────────────────

  /v1/webhooks/meta/deauthorize:
    post:
      tags:
        - Webhooks
      summary: Meta deauthorization callback
      description: |
        Called by Meta when a user removes the app from their Facebook/Instagram account.
        Verified via the `signed_request` parameter signed with the app secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signed_request
              properties:
                signed_request:
                  type: string
                  description: Meta-signed request payload
      responses:
        '200':
          description: Deauthorization acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /v1/webhooks/meta/data-deletion:
    post:
      tags:
        - Webhooks
      summary: Meta GDPR data deletion request
      description: |
        Called by Meta when a user requests deletion of their data via Facebook/Instagram settings.
        Returns a confirmation code and status URL as required by Meta's GDPR compliance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signed_request
              properties:
                signed_request:
                  type: string
                  description: Meta-signed request payload
      responses:
        '200':
          description: Deletion request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL to check deletion status
                  confirmation_code:
                    type: string
                    description: Unique code for this deletion request
    get:
      tags:
        - Webhooks
      summary: Check data deletion status
      description: Check the status of a Meta GDPR data deletion request. Returns an HTML status page.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Confirmation code from the data deletion response
      responses:
        '200':
          description: Deletion status page
          content:
            text/html:
              schema:
                type: string

  # ─── Admin ───────────────────────────────────────────────────────────

  /v1/admin/queue-status:
    get:
      tags:
        - Admin
      summary: Get queue status
      description: Get the status of the background job queue, workers, and queue statistics. Requires admin role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue status
          content:
            application/json:
