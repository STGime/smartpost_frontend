            type: string
          description: Comma-separated platform filter
      responses:
        '200':
          description: Engagement benchmarks
          content:
            application/json:
              schema:
                type: object
                properties:
                  benchmarks:
                    type: array
                    items:
                      type: object
                      properties:
                        platform:
                          type: string
                        metric:
                          type: string
                        average:
                          type: number
                        median:
                          type: number
                        p75:
                          type: number
                          description: 75th percentile
                        p90:
                          type: number
                          description: 90th percentile
        '403':
          description: Professional plan required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/analytics/refresh-all:
    post:
      tags:
        - Analytics
      summary: Refresh all analytics
      description: |
        Trigger a refresh of analytics data for all posts.
        Rate limited to 1 call per hour per user.
        Requires starter plan or above.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Analytics refresh completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  refreshedCount:
                    type: integer
                    description: Number of posts successfully refreshed
                  failedCount:
                    type: integer
                    description: Number of posts that failed to refresh
                  nextRefreshAt:
                    type: string
                    format: date-time
                    description: Earliest time the next refresh can be triggered
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  nextRefreshAt:
                    type: string
                    format: date-time
                  retryAfterSeconds:
                    type: integer
        '403':
          description: Plan upgrade required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── API Tokens ─────────────────────────────────────────────

  /v1/auth/tokens:
    get:
      tags:
        - API Tokens
      summary: List API tokens
      description: List all API tokens for the authenticated user. Token values are not returned — only metadata.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiToken'
    post:
      tags:
        - API Tokens
      summary: Create API token
      description: |
        Create a new API token. The raw token value is returned **only once** in the response.
        Store it securely — it cannot be retrieved again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Human-readable name for the token
                  example: CLI Token
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The raw API token (shown only once)
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/tokens/{tokenId}:
    delete:
      tags:
        - API Tokens
      summary: Revoke API token
      description: Permanently revoke an API token. Any integrations using this token will stop working immediately.
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Token revoked
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Webhook Endpoints ──────────────────────────────────────

  /v1/webhook-endpoints:
    get:
      tags:
        - Webhook Endpoints
      summary: List webhook endpoints
      description: List all webhook endpoints for the authenticated user. Also returns available events for the user's plan.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Endpoint list with plan info
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
                  available_events:
                    type: array
                    items:
                      type: string
                    description: Events available on the user's current plan
                  all_events:
                    type: array
                    items:
                      type: string
                    description: All possible webhook event types
    post:
      tags:
        - Webhook Endpoints
      summary: Create webhook endpoint
      description: |
        Create a new webhook endpoint. The signing secret is returned **only once** in the response.
        Store it securely — it cannot be retrieved again (unless regenerated via PATCH).

        Plan limits apply to the number of endpoints and available event types.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - events
              properties:
                url:
                  type: string
                  format: uri
                  description: Must be HTTPS (HTTP allowed for localhost in dev)
                  example: https://example.com/posta-webhook
                description:
                  type: string
                  maxLength: 200
                  description: Human-readable description
                events:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Event types to subscribe to
                  example: ["post.published", "post.failed"]
      responses:
        '201':
          description: Endpoint created (includes secret — save it now)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecret'
        '400':
          description: Validation error (invalid URL, no events, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Plan limit exceeded (max endpoints or disallowed events)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/webhook-endpoints/{id}:
    get:
      tags:
        - Webhook Endpoints
      summary: Get webhook endpoint
      description: Get endpoint details with the 10 most recent deliveries.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Endpoint with recent deliveries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookEndpoint'
                  - type: object
                    properties:
                      recent_deliveries:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookDelivery'
        '404':
          description: Endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Webhook Endpoints
      summary: Update webhook endpoint
      description: |
        Update URL, description, events, or active state. Set `regenerate_secret` to true
        to get a new signing secret (the new secret is returned in the response).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                description:
                  type: string
                  maxLength: 200
                events:
                  type: array
                  items:
                    type: string
                  minItems: 1
                is_active:
                  type: boolean
                regenerate_secret:
                  type: boolean
                  description: Set to true to generate a new signing secret
      responses:
        '200':
          description: Updated endpoint (includes secret only if regenerated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '404':
          description: Endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Webhook Endpoints
      summary: Delete webhook endpoint
      description: Delete an endpoint and all its delivery history. This cannot be undone.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Endpoint deleted
        '404':
          description: Endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/webhook-endpoints/{id}/test:
    post:
      tags:
        - Webhook Endpoints
      summary: Send test ping
      description: Send a `ping` event to the endpoint to verify it is reachable and correctly configured.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ping queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveryId:
                    type: string
                    format: uuid
        '404':
          description: Endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/webhook-endpoints/{id}/deliveries:
    get:
      tags:
        - Webhook Endpoints
      summary: List deliveries
      description: Paginated delivery history for an endpoint, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Delivery list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  total:
                    type: integer

  /v1/webhook-endpoints/{id}/deliveries/{deliveryId}/retry:
    post:
      tags:
        - Webhook Endpoints
      summary: Retry failed delivery
      description: Re-queue a failed delivery for another attempt.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retry queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Delivery is not in failed status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
