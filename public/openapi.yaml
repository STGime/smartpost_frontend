                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        platform:
                          type: string
                        username:
                          type: string
                          nullable: true
                        displayName:
                          type: string
                          nullable: true
                        profileImageUrl:
                          type: string
                          format: uri
                          nullable: true
                        missingScopes:
                          type: array
                          items:
                            type: string
                        description:
                          type: string

