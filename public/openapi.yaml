                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        caption:
                          type: string
                        platform:
                          type: string
                        posted_at:
                          type: string
                          format: date-time
                        engagement:
                          type: number
                        likes:
                          type: integer
                        comments:
                          type: integer
                        shares:
                          type: integer
                        views:
                          type: integer
                        impressions:
                          type: integer
                        engagementRate:
                          type: number
                  metrics:
                    type: object
                    description: Per-metric comparison with leader identification
        '400':
          description: Invalid number of post IDs (must be 2-4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Professional plan required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/analytics/export/csv:
    get:
      tags:
        - Analytics
      summary: Export analytics as CSV
      description: |
