    get:
      tags:
        - Analytics
      summary: Best posting times
      description: |
        Get a heatmap of the best times to post based on historical engagement data.
        Requires starter plan or above.
      security:
        - bearerAuth: []
      parameters:
        - name: platforms
          in: query
          schema:
            type: string
          description: Comma-separated platform filter
      responses:
        '200':
          description: Best times heatmap
          content:
            application/json:
              schema:
                type: object
                properties:
                  heatmap:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                          description: Day of week (MON-SUN)
                        hour:
                          type: integer
                          minimum: 0
                          maximum: 23
                        engagement:
                          type: number
                          description: Engagement score (0-100)
                  recommendedTimes:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                        hour:
                          type: integer
                        engagement:
                          type: number
        '403':
          description: Plan upgrade required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/analytics/content-types:
    get:
      tags:
        - Analytics
      summary: Content type breakdown
      description: |
        Get engagement breakdown by content type (photo, video, carousel, etc.).
        Requires starter plan or above.
      security:
        - bearerAuth: []
      parameters:
        - name: platforms
          in: query
          schema:
            type: string
          description: Comma-separated platform filter
      responses:
        '200':
          description: Content type analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Content type (e.g., photo, video, carousel)
                        count:
                          type: integer
                        avgEngagement:
                          type: number
                        avgReach:
                          type: number
        '403':
          description: Plan upgrade required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/analytics/hashtags:
    get:
      tags:
        - Analytics
      summary: Hashtag performance
      description: |
        Get performance metrics for hashtags used in posts.
        Requires professional plan.
      security:
        - bearerAuth: []
      parameters:
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [engagement, usage, views]
            default: engagement
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: platforms
          in: query
          schema:
            type: string
          description: Comma-separated platform filter
      responses:
        '200':
          description: Hashtag performance data
          content:
            application/json:
              schema:
                type: object
                properties:
                  hashtags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: string
                        count:
                          type: integer
