          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: platforms
          in: query
          schema:
            type: string
          description: Comma-separated platform filter
      responses:
        '200':
          description: CSV file download
