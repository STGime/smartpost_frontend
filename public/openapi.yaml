        '403':
          description: Professional plan required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/analytics/export/pdf:
    get:
      tags:
        - Analytics
      summary: Export analytics as PDF
      description: |
        Export analytics data as a PDF report download.
        Requires professional plan.
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: platforms
          in: query
          schema:
            type: string
          description: Comma-separated platform filter
      responses:
        '200':
          description: PDF file download
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="smartpost-analytics-2026-02-28.pdf"
        '403':
