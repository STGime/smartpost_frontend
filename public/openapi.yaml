openapi: 3.0.3
info:
  title: Posta API
  description: |
    Posta is a multi-platform social media auto-posting tool that helps content creators
    publish their content across multiple social media platforms simultaneously.

    ## Features
    - User authentication with JWT tokens
    - Media upload with smart cropping for different platforms
    - Social media account OAuth connections (TikTok, Instagram, etc.)
    - Subscription plan management

    ## Authentication
    Most endpoints require authentication using a Bearer token. Include the token in the
    Authorization header: `Authorization: Bearer <access_token>`

    ## Rate Limiting
    API requests are rate-limited based on your subscription plan.

    ## Platform Media Limits
    Each platform has specific limits on the number of media items per post:

    | Platform | Max Images | Max Videos | Notes |
    |----------|-----------|------------|-------|
    | Instagram | 10 | 1 | Carousel posts support up to 10 items |
    | Threads | 10 | 1 | Similar to Instagram |
    | LinkedIn | 20 | 1 | Multi-image posts; PDF carousels separate |
    | Facebook | 10 | 1 | Carousel posts |
    | Pinterest | 5 | 1 | Carousel pins |
    | X (Twitter) | 4 | 1 | Cannot mix images and video |
    | Bluesky | 4 | 0 | No video support yet |
    | TikTok | 1 | 1 | Primarily video platform |
    | YouTube | 0 | 1 | Video only (thumbnail separate) |

    **Important:** When a post includes video, most platforms only accept 1 video and ignore additional images.
  version: 1.0.0
  contact:
    name: Posta Support
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.getposta.app
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Platforms
    description: Platform specifications and requirements
  - name: Payments
    description: Stripe payment processing and subscription management
  - name: Auth
    description: Authentication and user session management
  - name: Users
    description: User profile and subscription management
  - name: Media
    description: Media upload and management
  - name: Social Accounts
    description: Social media account OAuth connections
  - name: Posts
    description: Post creation, scheduling, and publishing
  - name: Analytics
    description: Post performance analytics and metrics
  - name: Tags
    description: Hashtag tag management for posts
  - name: Feedback
    description: User feedback submission
  - name: Waiting List
    description: Pre-launch waiting list signup
  - name: SSE
    description: Server-Sent Events for real-time updates
  - name: Webhooks
    description: Third-party webhook callbacks (Meta/Facebook)
  - name: Webhook Endpoints
    description: |
      Outbound webhooks for programmatic notifications when posts are published, fail, or change status.
      Configure endpoints to receive real-time HTTP POST callbacks with signed payloads.

      **Event Types:**
      - `post.scheduled` — Post scheduled for publishing
      - `post.processing` — Publishing in progress
      - `post.published` — Fully published to all platforms
      - `post.partially_published` — Some platforms failed
      - `post.failed` — All platforms failed
      - `post.result.success` — Single platform succeeded
      - `post.result.failed` — Single platform failed

      **Plan Limits:**
      | Plan | Max Endpoints | Available Events | Log Retention |
      |------|--------------|------------------|---------------|
      | Trial | 1 | post.published, post.failed | 24 hours |
      | Starter | 3 | All events | 7 days |
      | Professional | 10 | All events | 30 days |

      **Signature Verification:**
      Each delivery includes an `X-Posta-Signature` header containing an HMAC-SHA256 hex digest.
      Verify using: `HMAC-SHA256(secret, X-Posta-Timestamp + "." + raw_body)`
  - name: API Tokens
    description: Create and manage API tokens for CLI and programmatic access
  - name: Admin
    description: Admin-only endpoints for system monitoring

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from login or signup

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          enum: [user, admin]
        onboarding_completed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Plan:
      type: object
      properties:
        plan:
          type: object
          properties:
            name:
              type: string
              enum: [free, starter, professional, business]
            status:
              type: string
              enum: [active, cancelled, expired, trial]
            started_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
        limits:
          type: object
          properties:
            posts_per_month:
              type: integer
            media_storage_mb:
              type: integer
            connected_accounts:
              type: integer
            scheduled_posts:
              type: integer
        usage:
          type: object
          properties:
            posts_this_month:
              type: integer
            storage_used_mb:
              type: number
            connected_accounts:
              type: integer
            scheduled_posts:
              type: integer

    Media:
      type: object
      description: |
        A media item (image or video) uploaded by the user.

        After upload confirmation, media is processed to generate platform-optimized variants
        with smart cropping that preserves faces and important content areas.
      properties:
        id:
          type: string
          format: uuid
          example: "2810592b-359e-4a87-a6e0-41085ab06474"
        name:
          type: string
          example: "my-video.mp4"
        type:
          type: string
          enum: [image, video]
          example: "video"
        mime_type:
          type: string
          example: "video/mp4"
        size_bytes:
          type: integer
          example: 15728640
        width:
          type: integer
          description: Original width in pixels
          example: 1920
        height:
          type: integer
          description: Original height in pixels
          example: 1080
        duration:
          type: number
          description: Duration in seconds (video only)
          example: 15.5
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: |
            - `pending` - Upload not yet confirmed
            - `processing` - Variants being generated
            - `completed` - All variants ready
            - `failed` - Processing failed
          example: "completed"
        thumbnail_url:
          type: string
          format: uri
          description: Signed URL for video thumbnail (videos only)
          example: "https://storage.googleapis.com/bucket/thumbnail.jpg?signature=..."
        original_url:
          type: string
          format: uri
          description: Signed URL to download the original media
          example: "https://storage.googleapis.com/bucket/original.mp4?signature=..."
        variants:
          type: array
          description: |
            Platform-optimized versions of this media.
            See MediaVariant schema for the full list of generated variants.
          items:
            $ref: '#/components/schemas/MediaVariant'
        created_at:
          type: string
          format: date-time
          example: "2024-12-19T20:00:00Z"
      example:
        id: "2810592b-359e-4a87-a6e0-41085ab06474"
        name: "my-video.mp4"
        type: "video"
        mime_type: "video/mp4"
        size_bytes: 15728640
        width: 1920
        height: 1080
        duration: 15.5
        status: "completed"
        thumbnail_url: "https://storage.googleapis.com/bucket/thumbnail.jpg?signature=..."
        original_url: "https://storage.googleapis.com/bucket/original.mp4?signature=..."
        variants:
          - id: "v1-uuid"
            platform: "tiktok"
            aspect_ratio: "9:16"
            width: 1080
            height: 1920
            url: "https://storage.googleapis.com/bucket/tiktok_9x16.mp4?signature=..."
          - id: "v2-uuid"
            platform: "instagram_feed_square"
            aspect_ratio: "1:1"
            width: 1080
            height: 1080
            url: "https://storage.googleapis.com/bucket/instagram_feed_square_1x1.mp4?signature=..."
          - id: "v3-uuid"
            platform: "facebook_reels"
            aspect_ratio: "9:16"
            width: 1080
            height: 1920
            url: "https://storage.googleapis.com/bucket/facebook_reels_9x16.mp4?signature=..."
        created_at: "2024-12-19T20:00:00Z"

    MediaListItem:
      type: object
      description: Lightweight media item for list responses (excludes face_data, variants, original_url)
      properties:
        id:
          type: string
          format: uuid
          example: "2810592b-359e-4a87-a6e0-41085ab06474"
        name:
          type: string
          example: "my-video.mp4"
        type:
          type: string
          enum: [image, video]
          example: "video"
        mime_type:
          type: string
          example: "video/mp4"
        size_bytes:
          type: integer
          example: 15728640
        width:
          type: integer
          description: Original width in pixels
          example: 1920
        height:
          type: integer
          description: Original height in pixels
          example: 1080
        duration:
          type: number
          description: Duration in seconds (video only)
          example: 15.5
        processing_status:
          type: string
          enum: [pending, processing, completed, failed]
          example: "completed"
        thumbnail_url:
          type: string
          format: uri
          description: Signed URL for video thumbnail (videos only)
          example: "https://storage.googleapis.com/bucket/thumbnail.jpg?signature=..."
        created_at:
          type: string
          format: date-time
          example: "2024-12-19T20:00:00Z"

    MediaVariant:
      type: object
      description: |
        A platform-optimized variant of the original media with smart cropping.

        Variants are automatically generated when media is uploaded and processed.
        Each variant is optimized for a specific platform's requirements including
        aspect ratio, dimensions, and encoding settings.

        **Available Variants:**

        | Platform | Aspect Ratio | Dimensions | Use Case |
        |----------|--------------|------------|----------|
        | tiktok | 9:16 | 1080x1920 | TikTok videos |
        | instagram_reels | 9:16 | 1080x1920 | Instagram Reels |
        | instagram_story | 9:16 | 1080x1920 | Instagram Stories |
        | instagram_feed_square | 1:1 | 1080x1080 | Instagram Feed |
        | instagram_feed_portrait | 4:5 | 1080x1350 | Instagram Feed |
        | facebook_reels | 9:16 | 1080x1920 | Facebook Reels |
        | facebook_story | 9:16 | 1080x1920 | Facebook Stories |
        | facebook_feed | 1:1 | 1200x1200 | Facebook Feed |
        | youtube_shorts | 9:16 | 1080x1920 | YouTube Shorts |
        | youtube_landscape | 16:9 | 1920x1080 | YouTube Videos |
        | twitter | 16:9 | 1200x675 | X/Twitter |
        | twitter_square | 1:1 | 1200x1200 | X/Twitter |
        | linkedin_square | 1:1 | 1200x1200 | LinkedIn |
        | linkedin_landscape | 1.91:1 | 1200x628 | LinkedIn |
        | linkedin_portrait | 4:5 | 1080x1350 | LinkedIn |
        | pinterest | 2:3 | 1000x1500 | Pinterest Pins |
        | pinterest_square | 1:1 | 1000x1000 | Pinterest |
        | bluesky | 16:9 | 2000x1125 | Bluesky |
        | bluesky_square | 1:1 | 2000x2000 | Bluesky |
        | threads | 1:1 | 1440x1440 | Threads |
        | threads_portrait | 4:5 | 1080x1350 | Threads |
        | threads_reels | 9:16 | 1080x1920 | Threads Reels |
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        platform:
          type: string
          description: Platform and variant identifier
          example: "instagram_reels"
          enum:
            - tiktok
            - instagram_reels
            - instagram_feed_square
            - instagram_feed_portrait
            - instagram_story
            - youtube_shorts
            - youtube_landscape
            - pinterest
            - pinterest_square
            - facebook_feed
            - facebook_story
            - facebook_reels
            - twitter
            - twitter_square
            - linkedin_square
            - linkedin_landscape
            - linkedin_portrait
            - bluesky
            - bluesky_square
            - threads
            - threads_portrait
            - threads_reels
        aspect_ratio:
          type: string
          description: Aspect ratio of the variant
          example: "9:16"
          enum:
            - '9:16'
            - '1:1'
            - '4:5'
            - '16:9'
            - '2:3'
            - '1.91:1'
        width:
          type: integer
          description: Width in pixels
          example: 1080
        height:
          type: integer
          description: Height in pixels
          example: 1920
        url:
          type: string
          format: uri
          description: Signed URL to download the variant (valid for 1 hour)
          example: "https://storage.googleapis.com/bucket/path/variant.mp4?signature=..."
      example:
        id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        platform: "instagram_reels"
        aspect_ratio: "9:16"
        width: 1080
        height: 1920
        url: "https://storage.googleapis.com/smartpost-media/users/xyz/media/abc/instagram_reels_9x16.mp4?X-Goog-Signature=..."

    SocialAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [tiktok, instagram, youtube, twitter, facebook, pinterest, linkedin, bluesky, threads]
        username:
          type: string
        display_name:
          type: string
        profile_image_url:
          type: string
          format: uri
        is_active:
          type: boolean
        connection_error:
          type: string
        token_expires_at:
          type: string
          format: date-time
        connected_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    Platform:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        features:
          type: array
          items:
            type: string

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caption:
          type: string
        status:
          type: string
          enum: [draft, scheduled, processing, posted, partially_posted, failed]
        scheduledAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        isDraft:
          type: boolean
        processingEnabled:
          type: boolean
        platformConfigurations:
          type: object
          description: Platform-specific settings
        media:
          type: array
          items:
            $ref: '#/components/schemas/PostMedia'
        socialAccounts:
          type: array
          items:
            $ref: '#/components/schemas/PostSocialAccount'
        results:
          type: array
          items:
            $ref: '#/components/schemas/PostResult'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostMedia:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mediaId:
          type: string
          format: uuid
        position:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [image, video]
        thumbnailUrl:
          type: string
          format: uri
        variants:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              aspectRatio:
                type: string
              url:
                type: string
                format: uri

    PostSocialAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        platform:
          type: string
        username:
          type: string
        displayName:
          type: string
        profileImageUrl:
          type: string
          format: uri

    PostResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        socialAccountId:
          type: integer
          description: FK to social_accounts.id (SERIAL/INTEGER)
        platform:
          type: string
        status:
          type: string
          enum: [pending, processing, success, failed]
        platformPostId:
          type: string
        platformPostUrl:
          type: string
          format: uri
        errorCode:
          type: string
        errorMessage:
          type: string
        publishedAt:
          type: string
          format: date-time

    PlatformConfigurations:
      type: object
      description: |
        Platform-specific configurations for posts.

        Each platform can have custom settings that override the default post content.
        Use these to customize captions, visibility, and platform-specific features.

        **Supported Platforms:**
        - `tiktok`: TikTok video posts with AI disclosure and engagement settings
        - `instagram`: Feed posts, Reels, and Stories
        - `youtube`: Videos and Shorts with privacy settings
        - `pinterest`: Pins with board selection and links
        - `facebook`: Feed posts, Reels, and Stories
        - `twitter`/`x`: Tweets with thread and reply settings
        - `linkedin`: Posts (up to 20 images), documents, and articles
        - `bluesky`: Posts with content labels and thread support
        - `threads`: Timeline posts and Reels
      properties:
        tiktok:
          $ref: '#/components/schemas/TikTokConfiguration'
        instagram:
          $ref: '#/components/schemas/InstagramConfiguration'
        youtube:
          $ref: '#/components/schemas/YouTubeConfiguration'
        pinterest:
          $ref: '#/components/schemas/PinterestConfiguration'
        facebook:
          $ref: '#/components/schemas/FacebookConfiguration'
        twitter:
          $ref: '#/components/schemas/XConfiguration'
        x:
          $ref: '#/components/schemas/XConfiguration'
        linkedin:
          $ref: '#/components/schemas/LinkedInConfiguration'
        bluesky:
          $ref: '#/components/schemas/BlueskyConfiguration'
        threads:
          $ref: '#/components/schemas/ThreadsConfiguration'

    TikTokConfiguration:
      type: object
      description: |
        TikTok-specific post settings. Note that TikTok API initially publishes
        videos as private (SELF_ONLY) - users can change visibility after posting.
      properties:
        caption:
          type: string
          maxLength: 2200
          description: Override the main caption for TikTok
        title:
          type: string
          maxLength: 150
          description: Video title (shown in feed)
        videoCoverTimestampMs:
          type: integer
          minimum: 0
          description: Timestamp in milliseconds for video thumbnail
        draft:
          type: boolean
          default: false
          description: If true, saves as draft instead of publishing (MEDIA_UPLOAD mode)
        isAigc:
          type: boolean
          default: false
          description: AI-generated content disclosure (required by TikTok for AI content)
        disableComment:
          type: boolean
          default: false
          description: Disable comments on the video
        disableDuet:
          type: boolean
          default: false
          description: Disable duet feature
        disableStitch:
          type: boolean
          default: false
          description: Disable stitch feature
        brandContentToggle:
          type: boolean
          default: false
          description: Mark as branded content (paid partnership)
        brandOrganicToggle:
          type: boolean
          default: false
          description: Mark as organic branded content

    InstagramConfiguration:
      type: object
      description: Instagram-specific post settings
      properties:
        caption:
          type: string
          maxLength: 2200
          description: Override the main caption for Instagram
        placement:
          type: string
          enum: [feed, reels, story]
          default: feed
          description: Where to post the content
        video_cover_timestamp_ms:
          type: integer
          minimum: 0
          description: Timestamp in milliseconds for video thumbnail (reels only)

    YouTubeConfiguration:
      type: object
      description: YouTube-specific post settings (not yet implemented)
      properties:
        caption:
          type: string
          description: Override the main caption for YouTube
        title:
          type: string
          maxLength: 100
          description: Video title
        description:
          type: string
          maxLength: 5000
          description: Video description
        tags:
          type: array
          items:
            type: string
          maxItems: 500
          description: Video tags
        privacy:
          type: string
          enum: [public, unlisted, private]
          default: private
          description: Video privacy setting

    PinterestConfiguration:
      type: object
      description: Pinterest-specific post settings (not yet implemented)
      properties:
        caption:
          type: string
          description: Override the main caption for Pinterest
        title:
          type: string
          maxLength: 100
          description: Pin title
        board_ids:
          type: array
          items:
            type: string
          description: Board IDs to pin to
        link:
          type: string
          format: uri
          description: Link URL for the pin
        video_cover_timestamp_ms:
          type: integer
          minimum: 0
          description: Timestamp for video thumbnail

    FacebookConfiguration:
      type: object
      description: Facebook-specific post settings (not yet implemented)
      properties:
        caption:
          type: string
          description: Override the main caption for Facebook
        placement:
          type: string
          enum: [feed, reels, story]
          default: feed
          description: Where to post the content

    ThreadsConfiguration:
      type: object
      description: Threads-specific post settings (not yet implemented)
      properties:
        caption:
          type: string
          description: Override the main caption for Threads
        location:
          type: string
          enum: [reels, timeline]
          default: timeline
          description: Where to post the content

    LinkedInConfiguration:
      type: object
      description: |
        LinkedIn-specific post settings. Supports regular posts, document/carousel posts, and articles.

        **Media Limits:**
        - Up to 20 images per post (multi-image)
        - 1 video per post
        - Cannot mix images and video

        **Post Types:**
        - `post`: Standard text + image/video post (up to 20 images)
        - `document`: Carousel/PDF document post (up to 300 pages, max 100MB)
        - `article`: Long-form article or article share

        **PDF Document Posts:**
        For carousel-style presentations, upload a multi-page PDF:
        1. Upload a multi-page PDF as media
        2. Set `postType: 'document'`
        3. Optionally set `documentTitle` for the carousel title
      properties:
        caption:
          type: string
          maxLength: 3000
          description: Override the main caption for LinkedIn
        visibility:
          type: string
          enum: [PUBLIC, CONNECTIONS]
          default: PUBLIC
          description: Who can see the post
        postType:
          type: string
          enum: [post, document, article]
          default: post
          description: |
            Type of LinkedIn content:
            - `post`: Standard post with text and optional media
            - `document`: PDF carousel (multi-page document)
            - `article`: Long-form article
        documentTitle:
          type: string
          maxLength: 150
          description: Title for document/carousel posts (displayed above the document)
        articleTitle:
          type: string
          maxLength: 200
          description: Title for article posts
        articleUrl:
          type: string
          format: uri
          description: URL to share as an article link post
        shareCommentary:
          type: string
          maxLength: 1300
          description: Commentary text when sharing an article or URL

    XConfiguration:
      type: object
      description: |
        X (Twitter) specific post settings.

        **Character Limits:**
        - Standard: 280 characters
        - Premium: 25,000 characters

        **Thread Mode:**
        When `threadMode: true`, the caption is split into multiple tweets.
        Use `threadSeparator` to define where to split (default: double newline).

        **Media:**
        - Up to 4 images per tweet
        - 1 video or GIF per tweet
        - Alt text is highly recommended for accessibility
      properties:
        caption:
          type: string
          description: Override the main caption for X
        threadMode:
          type: boolean
          default: false
          description: If true, split caption into a thread of multiple tweets
        threadSeparator:
          type: string
          default: "\n\n"
          description: Character/string used to split caption into thread parts
        altText:
          type: array
          items:
            type: string
            maxLength: 1000
          maxItems: 4
          description: Alt text for each image (accessibility)
        replySettings:
          type: string
          enum: [everyone, following, mentionedUsers]
          default: everyone
          description: Who can reply to this tweet
        quoteTweetId:
          type: string
          description: ID of a tweet to quote (creates a quote tweet)

    BlueskyConfiguration:
      type: object
      description: |
        Bluesky (AT Protocol) specific post settings.

        **Character Limit:** 300 characters per post

        **Thread Mode:**
        When `threadMode: true`, the caption is split into multiple posts.
        Use `threadSeparator` to define where to split.

        **Media:**
        - Up to 4 images per post
        - No video support yet (as of Dec 2024)
        - Alt text is highly encouraged

        **Content Labels:**
        Use labels to add content warnings for sensitive content.
      properties:
        caption:
          type: string
          maxLength: 300
          description: Override the main caption for Bluesky
        threadMode:
          type: boolean
          default: false
          description: If true, split caption into a thread of multiple posts
        threadSeparator:
          type: string
          default: "\n\n"
          description: Character/string used to split caption into thread parts
        altText:
          type: array
          items:
            type: string
            maxLength: 2000
          maxItems: 4
          description: Alt text for each image (accessibility)
        embedUrl:
          type: string
          format: uri
          description: URL to embed as a link card preview
        languages:
          type: array
          items:
            type: string
            pattern: ^[a-z]{2}(-[A-Z]{2})?$
          maxItems: 3
          description: ISO language codes (e.g., ['en', 'es-MX'])
        labels:
          type: array
          items:
            type: string
            enum: [nsfw, nudity, suggestive, gore, spoiler]
          description: Content warning labels for sensitive content

    PricingPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        planType:
          type: string
          enum: [starter, professional]
        billingInterval:
          type: string
          enum: [month, year]
        price:
          type: number
          description: Price in cents
        currency:
          type: string
          default: eur
        name:
          type: string
        features:
          type: array
          items:
            type: string

    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stripeSubscriptionId:
          type: string
        planType:
          type: string
          enum: [starter, professional]
        billingInterval:
          type: string
          enum: [month, year]
        status:
          type: string
          enum: [active, past_due, canceled, unpaid, trialing, incomplete, incomplete_expired, paused]
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        canceledAt:
          type: string
          format: date-time
          nullable: true

    PaymentHistoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stripePaymentIntentId:
          type: string
        amount:
          type: integer
          description: Amount in cents
        currency:
          type: string
        status:
          type: string
          enum: [succeeded, failed, pending, refunded]
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    AnalyticsOverview:
      type: object
      description: Aggregated analytics across all posts
      properties:
        totalPosts:
          type: integer
          description: Total number of posts with analytics
        totalLikes:
          type: integer
        totalComments:
          type: integer
        totalShares:
          type: integer
        totalViews:
          type: integer
        totalImpressions:
          type: integer
        totalReach:
          type: integer
        engagementRate:
          type: number
          format: float
          description: Overall engagement rate as percentage
        byPlatform:
          type: array
          items:
            $ref: '#/components/schemas/PlatformAnalytics'

    PlatformAnalytics:
      type: object
      properties:
        platform:
          type: string
        postsCount:
          type: integer
        likes:
          type: integer
        comments:
          type: integer
        shares:
          type: integer
        views:
          type: integer
        impressions:
          type: integer
        reach:
          type: integer
        engagementRate:
          type: number
          format: float

    PostAnalyticsSummary:
      type: object
      description: Summary analytics for a post
      properties:
        postId:
          type: string
          format: uuid
        postResultId:
          type: string
          format: uuid
        caption:
          type: string
          nullable: true
        platform:
          type: string
        platformPostUrl:
          type: string
          format: uri
          nullable: true
        publishedAt:
          type: string
          format: date-time
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
        likes:
          type: integer
        comments:
          type: integer
        shares:
          type: integer
        views:
          type: integer
        impressions:
          type: integer
        reach:
          type: integer
        totalEngagement:
          type: integer
        lastUpdated:
          type: string
          format: date-time

    PostAnalyticsDetail:
      allOf:
        - $ref: '#/components/schemas/PostAnalyticsSummary'
        - type: object
          properties:
            timeSeriesData:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  likes:
                    type: integer
                  comments:
                    type: integer
                  shares:
                    type: integer
                  views:
                    type: integer
                  impressions:
                    type: integer
            platformMetrics:
              type: object
              description: Platform-specific metrics

    TrendsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              value:
                type: number
        metric:
          type: string
        period:
          type: string

    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tag:
          type: string
        usage_count:
          type: integer
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    FeedbackRequest:
      type: object
      required:
        - category
        - comment
      properties:
        category:
          type: string
          enum: [bug, feature, improvement, other]
        comment:
          type: string
          minLength: 1
          maxLength: 2000

    WaitingListRequest:
      type: object
      required:
        - email
        - source
      properties:
        email:
          type: string
          format: email
        source:
          type: string
          enum: [hero, header, pricing]

    Worker:
      type: object
      properties:
        id:
          type: string
        queue:
          type: string
        status:
          type: string
          enum: [running, stopped, error]
        uptime:
          type: number
          description: Uptime in milliseconds
        startedAt:
          type: string
          format: date-time
        lastHeartbeat:
          type: string
          format: date-time
        errorMessage:
          type: string
          nullable: true

    QueueStatus:
      type: object
      properties:
        queueConnected:
          type: boolean
        queueHealthy:
          type: boolean
        workerSummary:
          type: object
          properties:
            total:
              type: integer
            running:
              type: integer
            stopped:
              type: integer
            error:
              type: integer
        workers:
          type: array
          items:
            $ref: '#/components/schemas/Worker'
        queueStats:
          type: object
          additionalProperties:
            type: object
            nullable: true
            properties:
              queued:
                type: integer
              active:
                type: integer

    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        events:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          properties:
            secret:
              type: string
              description: HMAC signing key (64-char hex). Only returned on creation or regeneration.

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        webhook_endpoint_id:
          type: string
          format: uuid
        event:
          type: string
          description: Event type (e.g. post.published, ping)
        payload:
          type: object
          description: The JSON payload that was sent
        response_status:
          type: integer
          nullable: true
          description: HTTP response status code
        response_body:
          type: string
          nullable: true
          description: Response body (truncated to 4KB)
        response_time_ms:
          type: integer
          nullable: true
        attempt:
          type: integer
        max_attempts:
          type: integer
        status:
          type: string
          enum: [pending, success, failed, retrying]
        error_message:
          type: string
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        next_retry_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

paths:
  /v1/platforms:
    get:
      tags:
        - Platforms
      summary: List all platforms
      description: Get a summary of all supported social media platforms
      responses:
        '200':
          description: List of platforms
          content:
            application/json:
              schema:
                type: object
                properties:
                  platforms:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: tiktok
                        name:
                          type: string
                          example: TikTok
                        color:
                          type: string
                          example: "#000000"
                        features:
                          type: array
                          items:
                            type: string
                        supportsImage:
                          type: boolean
                        supportsVideo:
                          type: boolean

  /v1/platforms/aspect-ratios:
    get:
      tags:
        - Platforms
      summary: Get aspect ratios
      description: Get all supported aspect ratios with their dimensions
      responses:
        '200':
          description: List of aspect ratios
          content:
            application/json:
              schema:
                type: object
                properties:
                  aspectRatios:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: "9:16"
                        width:
                          type: integer
                          example: 9
                        height:
                          type: integer
                          example: 16
                        name:
                          type: string
                          example: "9:16 (Vertical)"
                        decimal:
                          type: number
                          example: 0.5625

  /v1/platforms/specifications:
    get:
      tags:
        - Platforms
      summary: Get platform specifications
      description: |
        Get comprehensive specifications for all platforms including:
        - Image dimensions and file size limits
        - Video dimensions, duration, and file size limits
        - Caption and content restrictions
        - Platform-specific notes and recommendations
      responses:
        '200':
          description: Platform specifications summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  specifications:
                    type: array
                    items:
                      type: object
                      properties:
                        platform:
                          type: string
                          example: TikTok
                        id:
                          type: string
                          example: tiktok
                        image:
                          type: object
                          nullable: true
                          properties:
                            maxSize:
                              type: string
                              example: "20 MB"
                            maxDimensions:
                              type: string
                              example: "1080x1920"
                            aspectRatios:
                              type: array
                              items:
                                type: string
                            formats:
                              type: array
                              items:
                                type: string
                        video:
                          type: object
                          nullable: true
                          properties:
                            maxSize:
                              type: string
                              example: "287.6 MB"
                            maxDimensions:
                              type: string
                              example: "4096x4096"
                            duration:
                              type: string
                              example: "3s - 600s"
                            aspectRatios:
                              type: array
                              items:
                                type: string
                            formats:
                              type: array
                              items:
                                type: string
                        content:
                          type: object
                          properties:
                            maxCaption:
                              type: integer
                              example: 2200
                            maxTitle:
                              type: integer
                              nullable: true
                            supportsLinks:
                              type: boolean
                            supportsHashtags:
                              type: boolean
                        notes:
                          type: array
                          items:
                            type: string

  /v1/platforms/{platformId}:
    get:
      tags:
        - Platforms
      summary: Get platform details
      description: Get detailed specification for a specific platform
      parameters:
        - name: platformId
          in: path
          required: true
          schema:
            type: string
            enum: [tiktok, instagram, youtube, facebook, twitter, linkedin, pinterest, bluesky, threads]
          description: Platform identifier
      responses:
        '200':
          description: Platform specification
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  displayName:
                    type: string
                  color:
                    type: string
                  image:
                    type: object
                    nullable: true
                    description: Image specifications (null if platform doesn't support images)
                  video:
                    type: object
                    nullable: true
                    description: Video specifications (null if platform doesn't support video)
                  content:
                    type: object
                    description: Content restrictions (caption length, etc.)
                  features:
                    type: array
                    items:
                      type: string
                  notes:
                    type: array
                    items:
                      type: string
        '404':
          description: Platform not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payments/plans:
    get:
      tags:
        - Payments
      summary: Get pricing plans
      description: |
        Get all available pricing plans with their prices and features.
        This is a public endpoint for displaying on landing pages.
      responses:
        '200':
          description: Pricing plans retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: object
                    properties:
                      starter:
                        type: object
                        properties:
                          monthly:
                            $ref: '#/components/schemas/PricingPlan'
                          yearly:
                            $ref: '#/components/schemas/PricingPlan'
                      professional:
                        type: object
                        properties:
                          monthly:
                            $ref: '#/components/schemas/PricingPlan'
                          yearly:
                            $ref: '#/components/schemas/PricingPlan'
                  allPlans:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricingPlan'

  /v1/payments/status:
    get:
      tags:
        - Payments
      summary: Check payment configuration
      description: Check if Stripe payments are configured and available
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                    description: Whether Stripe is configured

  /v1/payments/checkout:
    post:
      tags:
        - Payments
      summary: Create checkout session
      description: |
        Create a Stripe Checkout session for subscribing to a plan.
        User will be redirected to Stripe's hosted payment page.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - planType
                - billingInterval
                - successUrl
                - cancelUrl
              properties:
                planType:
                  type: string
                  enum: [starter, professional]
                  description: The plan to subscribe to
                billingInterval:
                  type: string
                  enum: [month, year]
                  description: Monthly or yearly billing
                successUrl:
                  type: string
                  format: uri
                  description: URL to redirect after successful payment
                cancelUrl:
                  type: string
                  format: uri
                  description: URL to redirect if user cancels
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    description: Stripe Checkout Session ID
                  url:
                    type: string
                    format: uri
                    description: URL to redirect user to for payment
        '400':
          description: User already has active subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Payments not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payments/portal:
    post:
      tags:
        - Payments
      summary: Create customer portal session
      description: |
        Create a Stripe Customer Portal session for managing subscription.
        Users can update payment methods, cancel, or change plans.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - returnUrl
              properties:
                returnUrl:
                  type: string
                  format: uri
                  description: URL to redirect after leaving portal
      responses:
        '200':
          description: Portal session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL to redirect user to customer portal
        '404':
          description: No Stripe customer found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payments/subscription:
    get:
      tags:
        - Payments
      summary: Get current subscription
      description: Get the current user's subscription details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription details
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: '#/components/schemas/Subscription'
                    nullable: true
                  hasActiveSubscription:
                    type: boolean

  /v1/payments/subscription/cancel:
    post:
      tags:
        - Payments
      summary: Cancel subscription
      description: |
        Cancel the current subscription at the end of the billing period.
        User retains access until the period ends.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: '#/components/schemas/Subscription'
                  message:
                    type: string
                    example: Subscription will be cancelled at the end of the current billing period
        '404':
          description: No active subscription found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payments/subscription/resume:
    post:
      tags:
        - Payments
      summary: Resume cancelled subscription
      description: |
        Resume a subscription that was cancelled but hasn't ended yet.
        Only works if the subscription is set to cancel at period end.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: '#/components/schemas/Subscription'
                  message:
                    type: string
                    example: Subscription has been resumed
        '400':
          description: Subscription cannot be resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/payments/history:
    get:
      tags:
        - Payments
      summary: Get payment history
      description: Get the user's payment history with pagination
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentHistoryItem'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /v1/payments/webhook:
    post:
      tags:
        - Payments
      summary: Stripe webhook
      description: |
        Endpoint for Stripe to send webhook events.
        **This endpoint is called by Stripe, not by your application.**

        Handles events:
        - checkout.session.completed
        - customer.subscription.created
        - customer.subscription.updated
        - customer.subscription.deleted
        - invoice.paid
        - invoice.payment_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe Event object
      responses:
        '200':
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        '400':
          description: Invalid signature or missing header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/health:
    get:
      tags:
        - Health
      summary: Full health check
      description: Returns detailed health status including database and storage connectivity
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                      storage:
                        type: string

  /v1/health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Simple liveness check for load balancers
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Get a new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: Sign out and invalidate session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Send password reset email. Always returns success to prevent email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: Reset password using token from email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /v1/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Get the currently authenticated user's basic info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Get the current user's full profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
